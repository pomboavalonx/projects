<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLIX ULTRA // AI Image Generator</title>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --accent: #ff007f;
            --bg: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #e0e0e0;
            --text-dim: #9999aa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            width: 95%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 2rem;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            text-align: center;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .logo-container {
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 0 20px var(--primary);
        }

        h1 {
            font-size: 2.5rem;
            margin: 0.5rem 0 1.5rem 0;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 900;
        }

        .vision-container {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .vision-btn {
            flex: 1;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            margin: 0;
            padding: 14px;
            font-size: 0.95rem;
        }

        .vision-btn:hover {
            box-shadow: 0 5px 25px rgba(255, 0, 204, 0.5);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 600px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
            .full-width-mobile {
                grid-column: span 1;
            }
            h1 {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }
            .container {
                padding: 1.2rem;
                border-radius: 18px;
            }
            .controls {
                flex-direction: column;
            }
            .controls button {
                width: 100%;
            }
        }

        .input-box {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-left: 4px;
        }

        input[type="text"], select {
            padding: 13px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.4);
            background: rgba(0, 0, 0, 0.7);
        }

        .full-width {
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .full-width {
                grid-column: span 1;
            }
        }

        button {
            padding: 15px 25px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 255, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            letter-spacing: 3px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .btn-save {
            background: linear-gradient(45deg, #00c853, #009688);
        }

        .btn-save:hover:not(:disabled) {
            box-shadow: 0 5px 20px rgba(0, 200, 83, 0.4);
        }

        .loader-container {
            display: none;
            margin: 25px auto;
            text-align: center;
        }

        .loader {
            width: 50px;
            height: 50px;
            margin: 0 auto 12px auto;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        #loader-text {
            color: var(--primary);
            font-size: 0.95rem;
            letter-spacing: 1px;
            font-weight: 500;
            margin: 0;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        .result-area {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        #generated-image {
            width: 100%;
            max-width: 600px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            border: 2px solid var(--primary);
            transition: transform 0.3s ease;
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        #translated-text {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 10px;
            display: inline-block;
            max-width: 100%;
            word-break: break-word;
        }

        .gallery-header {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .gallery-title {
            font-size: 0.9rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .btn-clear-history {
            background: transparent;
            color: var(--accent);
            border: 1px solid rgba(255, 0, 127, 0.3);
            padding: 6px 14px;
            font-size: 0.75rem;
            border-radius: 8px;
        }

        .btn-clear-history:hover {
            background: rgba(255, 0, 127, 0.15);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .gallery img:hover {
            border-color: var(--primary);
            transform: scale(1.08);
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.4);
        }

        #fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            padding: 20px;
        }

        #fullscreen-overlay img {
            max-width: 95vw;
            max-height: 95vh;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.3);
            object-fit: contain;
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .footer-link {
            color: var(--text-dim);
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .footer-link:hover {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        #camera-video, #camera-canvas, #camera-file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="/static/icon.jpg" alt="Polix Logo" class="logo" onerror="this.style.display='none'">
        </div>
        <h1>POLIX ULTRA</h1>
        
        <div class="vision-container">
            <button class="vision-btn" onclick="activateVision()">👁️ ATIVAR OLHO DIGITAL</button>
            <input type="file" id="camera-file-input" accept="image/*" onchange="handleVisionFile(event)">
        </div>

        <div class="settings-grid">
            <div class="input-box full-width">
                <label for="prompt">Prompt Principal</label>
                <input type="text" id="prompt" placeholder="Ex: Um samurai cyberpunk em Neo-Tóquio, ultra detalhado..." autocomplete="off">
            </div>
            <div class="input-box full-width">
                <label for="negative">Prompt Negativo (O que evitar)</label>
                <input type="text" id="negative" placeholder="Ex: borrado, baixa qualidade, mãos deformadas..." autocomplete="off">
            </div>
            <div class="input-box">
                <label for="ratio">Formato (Ratio)</label>
                <select id="ratio">
                    <option value="1:1">Quadrado (1:1)</option>
                    <option value="16:9">Paisagem (16:9)</option>
                    <option value="9:16">Retrato (9:16)</option>
                </select>
            </div>
            <div class="input-box">
                <label for="style">Estilo Artístico</label>
                <select id="style">
                    <option value="none">Nenhum (Original)</option>
                    <option value="cyberpunk">Cyberpunk / Neon</option>
                    <option value="photoreal">Fotorealista / UHD</option>
                    <option value="anime">Anime / Studio Ghibli</option>
                    <option value="oil_painting">Pintura a Óleo</option>
                    <option value="concept_art">Concept Art / Digital</option>
                </select>
            </div>
            <div class="input-box full-width">
                <label for="engine">Motor do Olho Digital</label>
                <select id="engine">
                    <option value="local">Ollama Localhost</option>
                    <option value="site">Ollama Site (Cloud)</option>
                </select>
            </div>
            <div class="input-box full-width" style="margin-top: 10px;">
                <button class="btn-generate" id="btn-generate" onclick="generateImage()">GERAR IMAGEM</button>
            </div>
        </div>

        <div class="loader-container" id="loader-container">
            <div class="loader" id="loader"></div>
            <p id="loader-text">Processando...</p>
        </div>

        <div class="result-area" id="result-area">
            <div class="image-wrapper">
                <img src="" id="generated-image" alt="Imagem Gerada">
            </div>
            <div class="controls">
                <button class="btn-secondary" onclick="openFullscreen()">Tela Cheia ⛶</button>
                <button class="btn-save" id="btn-save" onclick="saveImageToServer()">Salvar no Sistema 💾</button>
                <button class="btn-secondary" onclick="downloadDirect()">Baixar Imagem ⬇</button>
            </div>
            <div>
                <p id="translated-text"></p>
            </div>
        </div>

        <div id="gallery-section" style="display:none;">
            <div class="gallery-header">
                <span class="gallery-title">Galeria Recente</span>
                <button class="btn-clear-history" onclick="clearHistory()">Limpar Histórico 🗑️</button>
            </div>
            <div class="gallery" id="gallery"></div>
        </div>

        <footer>
            <span class="footer-link">POLIX ULTRA // Paulo Roberto Nascimento</span>
        </footer>
    </div>

    <div id="fullscreen-overlay" onclick="this.style.display='none'">
        <img src="" id="fullscreen-img" alt="Tela Cheia">
    </div>

    <video id="camera-video" autoplay playsinline></video>
    <canvas id="camera-canvas"></canvas>

    <script>
        const promptInput = document.getElementById('prompt');
        const negativeInput = document.getElementById('negative');
        const ratioSelect = document.getElementById('ratio');
        const styleSelect = document.getElementById('style');
        const engineSelect = document.getElementById('engine');
        const btnGenerate = document.getElementById('btn-generate');
        const loaderContainer = document.getElementById('loader-container');
        const loaderText = document.getElementById('loader-text');
        const resultArea = document.getElementById('result-area');
        const generatedImg = document.getElementById('generated-image');
        const translatedText = document.getElementById('translated-text');
        const gallerySection = document.getElementById('gallery-section');
        const gallery = document.getElementById('gallery');
        const fileInput = document.getElementById('camera-file-input');

        // Permite disparar geração ao pressionar Enter no prompt
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                generateImage();
            }
        });

        function showLoader(message) {
            loaderText.innerText = message || 'Processando...';
            loaderContainer.style.display = 'block';
        }

        function hideLoader() {
            loaderContainer.style.display = 'none';
            loaderText.innerText = '';
        }

        // ==========================================
        // 1. CARREGAMENTO E GERENCIAMENTO DA GALERIA
        // ==========================================
        async function loadGallery() {
            try {
                const response = await fetch('/get_history');
                if (!response.ok) return;
                const history = await response.json();
                
                if (!Array.isArray(history) || history.length === 0) {
                    gallerySection.style.display = 'none';
                    gallery.style.display = 'none';
                    gallery.innerHTML = '';
                    return;
                }

                gallery.innerHTML = '';
                // Filtra itens com URLs válidas
                const validItems = history.filter(item => item && item.url && item.url.startsWith('http'));
                if (validItems.length === 0) {
                    gallerySection.style.display = 'none';
                    return;
                }

                gallerySection.style.display = 'block';
                gallery.style.display = 'grid';

                // Exibe os mais recentes primeiro
                [...validItems].reverse().forEach(item => {
                    const thumb = document.createElement('img');
                    thumb.src = item.url;
                    thumb.loading = 'lazy';
                    thumb.title = item.prompt || 'Imagem';
                    thumb.onerror = () => thumb.remove();
                    thumb.onclick = () => {
                        generatedImg.src = item.url;
                        translatedText.innerText = item.prompt ? `Prompt original: ${item.prompt}` : '';
                        resultArea.style.display = 'block';
                        resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    };
                    gallery.appendChild(thumb);
                });
            } catch (e) {
                console.warn('Não foi possível carregar o histórico:', e);
            }
        }

        // ==========================================
        // 2. GERAÇÃO DE IMAGEM COM A IA
        // ==========================================
        async function generateImage() {
            const prompt = promptInput.value.trim();
            const negative = negativeInput.value.trim();
            const ratio = ratioSelect.value;
            const style = styleSelect.value;

            if (!prompt) {
                alert('Por favor, informe uma descrição no Prompt Principal!');
                promptInput.focus();
                return;
            }

            btnGenerate.disabled = true;
            btnGenerate.innerText = 'CONECTANDO À IA...';
            showLoader('Traduzindo prompt e configurando motor AI...');
            resultArea.style.display = 'none';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        negative: negative,
                        ratio: ratio,
                        style: style
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.url) {
                    throw new Error(data.error || `Erro no servidor (Código ${response.status})`);
                }

                // Atualiza status do loader enquanto a imagem carrega no navegador
                showLoader('🎨 Renderizando sua imagem com IA... Isso leva alguns segundos.');
                btnGenerate.innerText = 'RENDERIZANDO...';

                // Pré-carrega a imagem antes de exibir para evitar quadros em branco
                const preload = new Image();
                preload.onload = () => {
                    generatedImg.src = data.url;
                    translatedText.innerText = `Traduzido para: "${data.translated}"`;
                    resultArea.style.display = 'block';
                    hideLoader();
                    btnGenerate.disabled = false;
                    btnGenerate.innerText = 'GERAR IMAGEM';
                    loadGallery();
                    resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                };

                preload.onerror = () => {
                    hideLoader();
                    btnGenerate.disabled = false;
                    btnGenerate.innerText = 'GERAR IMAGEM';
                    alert('A IA demorou para responder ou houve uma oscilação na conexão com o gerador. Tente clicar em "GERAR IMAGEM" novamente!');
                };

                preload.src = data.url;

            } catch (err) {
                hideLoader();
                btnGenerate.disabled = false;
                btnGenerate.innerText = 'GERAR IMAGEM';
                alert('Erro ao gerar imagem:\n' + err.message);
            }
        }

        // ==========================================
        // 3. SALVAR E BAIXAR IMAGEM
        // ==========================================
        async function saveImageToServer() {
            const url = generatedImg.getAttribute('src');
            if (!url || !url.startsWith('http')) {
                return alert('Gere uma imagem primeiro antes de tentar salvar!');
            }

            const btnSave = document.getElementById('btn-save');
            const originalText = btnSave.innerText;
            btnSave.disabled = true;
            btnSave.innerText = 'Salvando no celular... ⏳';

            try {
                const response = await fetch('/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok && data.message) {
                    alert('✓ ' + data.message);
                } else {
                    alert('Erro ao salvar no sistema: ' + (data.error || 'Falha no servidor.'));
                }
            } catch (e) {
                alert('Erro de conexão com o servidor ao tentar salvar a imagem!');
            } finally {
                btnSave.disabled = false;
                btnSave.innerText = originalText;
            }
        }

        function downloadDirect() {
            const url = generatedImg.getAttribute('src');
            if (!url || !url.startsWith('http')) {
                return alert('Gere uma imagem primeiro para baixar!');
            }
            const a = document.createElement('a');
            a.href = url;
            a.download = `polix_${Date.now()}.jpg`;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function openFullscreen() {
            const url = generatedImg.getAttribute('src');
            const overlay = document.getElementById('fullscreen-overlay');
            const fsImg = document.getElementById('fullscreen-img');
            if (url && url.startsWith('http')) {
                fsImg.src = url;
                overlay.style.display = 'flex';
            }
        }

        // ==========================================
        // 4. OLHO DIGITAL (CÂMERA E UPLOAD)
        // ==========================================
        function activateVision() {
            // Se o navegador suportar mediaDevices (contexto seguro), tenta a câmera
            if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function') {
                startCameraCapture();
            } else {
                // Em HTTP ou dispositivos sem getUserMedia direto, abre o seletor nativo de câmera/arquivo
                fileInput.click();
            }
        }

        async function startCameraCapture() {
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('camera-canvas');
            const engine = engineSelect.value;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' } }
                });

                video.srcObject = stream;
                await video.play();

                // Aguarda 800ms para estabilizar a exposição da câmera
                await new Promise(r => setTimeout(r, 800));

                const width = video.videoWidth || 640;
                const height = video.videoHeight || 480;

                // Redimensiona se for muito grande para evitar envio pesado
                const maxDim = 1024;
                let finalW = width, finalH = height;
                if (width > maxDim || height > maxDim) {
                    if (width > height) {
                        finalW = maxDim;
                        finalH = Math.round((height * maxDim) / width);
                    } else {
                        finalH = maxDim;
                        finalW = Math.round((width * maxDim) / height);
                    }
                }

                canvas.width = finalW;
                canvas.height = finalH;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, finalW, finalH);

                const base64Image = canvas.toDataURL('image/jpeg', 0.85);

                // Encerra a câmera
                stream.getTracks().forEach(t => t.stop());

                // Envia para análise
                sendImageToVision(base64Image, engine);

            } catch (err) {
                console.warn('Falha no getUserMedia direto, acionando seletor de arquivos:', err);
                fileInput.click();
            }
        }

        function handleVisionFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('camera-canvas');
                    const maxDim = 1024;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const base64Image = canvas.toDataURL('image/jpeg', 0.85);
                    const engine = engineSelect.value;
                    sendImageToVision(base64Image, engine);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = ''; // Limpa para permitir nova seleção
        }

        async function sendImageToVision(base64Image, engine) {
            showLoader(`👁️ Olho Digital (${engine}) analisando a cena... Aguarde.`);

            try {
                const response = await fetch('/analyze_image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: base64Image,
                        engine: engine
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || data.error) {
                    throw new Error(data.error || `Erro de resposta HTTP ${response.status}`);
                }

                if (data.description_pt || data.prompt) {
                    const resultText = data.description_pt || data.prompt;
                    promptInput.value = resultText;
                    promptInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    promptInput.focus();
                    alert('👁️ Olho Digital analisou a imagem com sucesso!\n\nDescrição inserida no Prompt: ' + resultText);
                } else {
                    alert('O Olho Digital não conseguiu reconhecer os detalhes da imagem.');
                }
            } catch (err) {
                alert('Erro no Olho Digital:\n' + err.message);
            } finally {
                hideLoader();
            }
        }

        // ==========================================
        // 5. LIMPEZA DE HISTÓRICO
        // ==========================================
        async function clearHistory() {
            if (!confirm('Deseja realmente apagar todo o histórico de imagens geradas?')) {
                return;
            }

            try {
                const response = await fetch('/clear_history', { method: 'POST' });
                const data = await response.json().catch(() => ({}));
                
                alert(data.message || 'Histórico apagado com sucesso!');
                gallery.innerHTML = '';
                gallery.style.display = 'none';
                gallerySection.style.display = 'none';
            } catch (e) {
                alert('Erro ao tentar limpar histórico no servidor.');
            }
        }

        // Inicializa galeria ao carregar a página
        window.onload = loadGallery;
    </script>
</body>
</html>
