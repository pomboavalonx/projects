<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Slots | Ultra Cyber Casino</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-gold: #ffcc00;
            --dark-bg: #0a0a0c;
            --panel-bg: #1a1a2e;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('wallpaper.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: white;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .casino-container {
            background: var(--panel-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            border: 3px solid var(--neon-blue);
            text-align: center;
            position: relative;
            width: 400px;
        }

        h1 {
            font-size: 2rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            margin: 0 0 1rem 0;
            text-transform: uppercase;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--neon-pink);
        }

        .multiplier-tag {
            color: var(--neon-gold);
            text-shadow: 0 0 5px var(--neon-gold);
        }

        .slot-machine {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 10px;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            border: 4px solid #333;
            margin: 0 auto 2rem auto;
            width: fit-content;
        }

        .reel {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #222, #111);
            border: 2px solid var(--neon-pink);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: inset 0 0 10px #000;
            transition: background 0.3s;
        }

        .reel.wild {
            background: linear-gradient(145deg, #444, #000);
            border-color: var(--neon-gold);
            box-shadow: 0 0 15px var(--neon-gold);
        }

        .spinning {
            animation: blur 0.1s infinite linear;
        }

        @keyframes blur {
            0% { transform: translateY(-5px); filter: blur(2px); }
            50% { transform: translateY(5px); filter: blur(4px); }
            100% { transform: translateY(-5px); filter: blur(2px); }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input {
            background: #000;
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 5px;
            width: 100px;
        }

        button {
            background: var(--neon-blue);
            color: black;
            border: none;
            padding: 12px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.3s;
            box-shadow: 0 0 15px var(--neon-blue);
            text-transform: uppercase;
        }

        button:hover { transform: scale(1.05); background: #fff; }
        button:disabled { background: #555; box-shadow: none; cursor: not-allowed; }

        .message {
            margin-top: 1.5rem;
            height: 1.5rem;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .win { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .lose { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }

        /* Paytable Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--panel-bg);
            padding: 2rem;
            border-radius: 20px;
            border: 2px solid var(--neon-blue);
            text-align: left;
        }
        .pay-item {
            display: flex;
            justify-content: space-between;
            width: 250px;
            margin: 5px 0;
            font-size: 1.1rem;
        }
        .close-btn {
            margin-top: 20px;
            cursor: pointer;
            color: var(--neon-pink);
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="casino-container">
        <h1>🌌 Nébula Slots Ultra 🌌</h1>
        
        <div class="stats-bar">
            <span>💰 $<span id="balance">1000</span></span>
            <span class="multiplier-tag">MULT: x<span id="mult">1</span></span>
        </div>

        <div class="slot-machine" id="grid"></div>

        <div class="controls">
            <div class="input-group">
                <span>Aposta: </span>
                <input type="number" id="bet" value="10" min="1">
            </div>
            <button id="spinBtn">GIRAR!</button>
            <div style="cursor:pointer; color:var(--neon-blue); text-decoration:underline;" onclick="toggleModal()">Tabela de Prêmios</div>
        </div>

        <div class="message" id="msg">Boa sorte, jogador!</div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2 style="color:var(--neon-blue); text-align:center;">Tabela de Ganhos</h2>
            <div class="pay-item"><span>7️⃣ 7️⃣ 7️⃣</span> <span>x50</span></div>
            <div class="pay-item"><span>💎 💎 💎</span> <span>x10</span></div>
            <div class="pay-item"><span>🔔 🔔 🔔</span> <span>x5</span></div>
            <div class="pay-item"><span>🍊 🍊 🍊</span> <span>x3</span></div>
            <div class="pay-item"><span>🍋 🍋 🍋</span> <span>x2</span></div>
            <div class="pay-item"><span>🍒 🍒 🍒</span> <span>x1</span></div>
            <div class="pay-item" style="color:var(--neon-gold)"><span>🌟 (SCATTER)</span> <span>10 Giros Grátis</span></div>
            <div class="pay-item" style="color:var(--neon-gold)"><span>🃏 (WILD)</span> <span>Substitui qualquer fruta</span></div>
            <div class="close-btn" onclick="toggleModal()">[ FECHAR ]</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
